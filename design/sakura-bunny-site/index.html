<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="春日慢递——一封来自樱花小径的温柔问候。" />
    <title>春日慢递 · 兔兔邮局</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="petal-field" aria-hidden="true"></div>

    <header class="site-header">
      <a class="brand" href="#top" aria-label="春日慢递首页">
        <span class="brand-mark" aria-hidden="true"><span></span></span>
        <span>春日慢递</span>
      </a>
      <nav aria-label="主导航">
        <a href="#letter">今日花笺</a>
        <a href="#list">春日清单</a>
      </nav>
      <button class="sound-toggle" type="button" aria-pressed="false">
        <span class="sound-icon" aria-hidden="true"></span>
        <span>听见春天</span>
      </button>
    </header>

    <main id="top">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-copy">
          <p class="eyebrow"><span></span> 樱花小径 · 晴</p>
          <h1 id="hero-title">春天正在<br /><em>轻轻发生</em></h1>
          <p class="hero-intro">兔兔捎来一篮刚刚好的阳光，提醒你：慢一点，也会准时遇见花开。</p>
          <div class="hero-actions">
            <a class="button button-primary" href="#letter">领取今日花笺 <span aria-hidden="true">→</span></a>
            <a class="text-link" href="#list">看看散步清单 <span aria-hidden="true">↘</span></a>
          </div>
          <div class="weather-note" aria-label="今日春日气象">
            <span class="sun" aria-hidden="true"></span>
            <div><strong>18°</strong><small>风里有樱花香</small></div>
          </div>
        </div>

        <figure class="hero-visual">
          <div class="image-frame">
            <img src="./assets/bunny-spring.png" alt="戴着蝴蝶结、挎着花篮的小白兔站在樱花小径上" />
            <span class="image-tag">SPRING<br />POST<br />2026</span>
          </div>
          <figcaption>
            <span>NO. 04</span>
            <p>在去往花开的路上<br />收集一点小小欢喜</p>
          </figcaption>
        </figure>
      </section>

      <section class="letter-section" id="letter" aria-labelledby="letter-title">
        <div class="section-heading">
          <p class="eyebrow"><span></span> A LITTLE NOTE FOR YOU</p>
          <h2 id="letter-title">拆开一封今日花笺</h2>
          <p>轻点信封，让兔兔替春天说一句话。</p>
        </div>

        <div class="letter-stage">
          <button class="envelope" type="button" aria-expanded="false" aria-controls="message-card">
            <span class="envelope-back"></span>
            <span class="message-card" id="message-card">
              <span class="message-label">今日花笺</span>
              <strong>你不必一直赶路，<br />花会在你停下时盛开。</strong>
              <small>— 樱花小径邮局</small>
            </span>
            <span class="envelope-front"></span>
            <span class="envelope-flap"></span>
            <span class="seal" aria-hidden="true">春</span>
          </button>
          <p class="letter-hint">点击信封拆阅 · 再点一次换一封</p>
        </div>
      </section>

      <section class="list-section" id="list" aria-labelledby="list-title">
        <div class="list-intro">
          <p class="eyebrow"><span></span> SLOW DOWN A LITTLE</p>
          <h2 id="list-title">兔兔的<br />春日散步清单</h2>
          <p>不必完成什么大事。三件轻盈的小事，就足够让普通的一天有一点闪光。</p>
        </div>

        <ol class="spring-list">
          <li>
            <button type="button" aria-pressed="false">
              <span class="item-number">01</span>
              <span class="item-copy"><strong>晒十分钟太阳</strong><small>把口袋里的阴天晾一晾</small></span>
              <span class="check" aria-hidden="true"></span>
            </button>
          </li>
          <li>
            <button type="button" aria-pressed="false">
              <span class="item-number">02</span>
              <span class="item-copy"><strong>发现一朵小花</strong><small>不用摘下，记住它的颜色</small></span>
              <span class="check" aria-hidden="true"></span>
            </button>
          </li>
          <li>
            <button type="button" aria-pressed="false">
              <span class="item-number">03</span>
              <span class="item-copy"><strong>给喜欢的人写句话</strong><small>一句“今天也想起你”就很好</small></span>
              <span class="check" aria-hidden="true"></span>
            </button>
          </li>
        </ol>
      </section>
    </main>

    <footer>
      <div class="footer-flower" aria-hidden="true"><i></i><i></i><i></i><i></i><span></span></div>
      <p>愿每一个平常日子，都有一场小小花开。</p>
      <a href="#top">回到春天 <span aria-hidden="true">↑</span></a>
      <small>SPRING POST OFFICE · MADE WITH SUNSHINE</small>
    </footer>

    <script src="./script.js"></script>
  </body>
</html>
