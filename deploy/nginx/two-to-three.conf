# Production nginx configuration for 3.lovesun.top.
# A valid certificate is provisioned by certbot under the paths below.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

server {
    listen 80;
    listen [::]:80;
    server_name 3.lovesun.top;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Keep a direct-origin recovery path while DNS/Cloudflare is unavailable.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 8.153.36.240 _;

    root /opt/two-to-three/dist;
    index index.html;
    client_max_body_size 220m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location /data/   { proxy_pass http://127.0.0.1:8000; }
    location /public/ { proxy_pass http://127.0.0.1:8000; }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location /        { try_files $uri $uri/ /index.html; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 3.lovesun.top;

    ssl_certificate /etc/letsencrypt/live/3.lovesun.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3.lovesun.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/two-to-three/dist;
    index index.html;
    client_max_body_size 220m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location /data/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /public/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
